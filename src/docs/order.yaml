tags:
  - name: Orders - Customer
    description: Order endpoints accessible only by authenticated customers.
  - name: Orders - Vendor
    description: Order endpoints accessible only by authenticated vendors.
  - name: Orders - Shared
    description: Order endpoints accessible by both authenticated customers and vendors.

paths:
  # ─────────────────────────────────────────
  # CUSTOMER ROUTES
  # ─────────────────────────────────────────

  /orders/customer/create:
    post:
      summary: Create orders from cart items
      description: >
        Places orders for the authenticated customer. Accepts an array of cart items directly in the request body.
        Orders are automatically **split per store** — if items belong to multiple stores, separate orders are created for each store.
        Stock is validated and decremented for each product on successful order creation.
      tags:
        - Orders - Customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              - productId: "64prd001abc111"
                quantity: 2
                sellingPrice: 1199
              - productId: "64prd002abc222"
                quantity: 1
                sellingPrice: 799
      responses:
        "201":
          description: Orders placed successfully (one per store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Orders Placed."
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
              example:
                success: true
                message: "Orders Placed."
                data:
                  orders:
                    - _id: "64ord001abc111"
                      user: "64usr001abc111"
                      store: "64str001abc111"
                      items:
                        - product: "64prd001abc111"
                          quantity: 2
                          price: 1299
                          sellingPrice: 1199
                      totalAmount: 2398
                      status: "Pending"
                      createdAt: "2024-01-01T10:00:00.000Z"
                      updatedAt: "2024-01-01T10:00:00.000Z"
        "400":
          description: No items provided or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noItems:
                  summary: Empty items array
                  value:
                    success: false
                    message: "No items provided to Order."
                insufficientStock:
                  summary: Stock not available
                  value:
                    success: false
                    message: "Running Shoes's Stock is Insufficient."
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "64prd001abc111 Product not found"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/customer:
    get:
      summary: List all orders of the customer
      description: Returns all orders placed by the authenticated customer, with fully populated product, store, and store owner details.
      tags:
        - Orders - Customer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "John Orders fetched."
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/PopulatedOrder"
              example:
                success: true
                message: "John Orders fetched."
                data:
                  orders:
                    - _id: "64ord001abc111"
                      user: "64usr001abc111"
                      store:
                        _id: "64str001abc111"
                        storeName: "SportZone"
                        owner:
                          _id: "64usr002abc222"
                          username: "VendorJohn"
                      items:
                        - product:
                            _id: "64prd001abc111"
                            productName: "Running Shoes"
                            price: 1299
                            sellingPrice: 1199
                          quantity: 2
                          price: 1299
                          sellingPrice: 1199
                      totalAmount: 2398
                      status: "Pending"
                      createdAt: "2024-01-01T10:00:00.000Z"
                      updatedAt: "2024-01-01T10:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/customer/{orderId}:
    put:
      summary: Edit a pending order
      description: >
        Updates the items and total amount of an existing order.
        Only orders with status **"Pending"** can be edited.
        Stock is re-validated for updated items.
      tags:
        - Orders - Customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the order to edit
          example: "64ord001abc111"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditOrderRequest"
            example:
              items:
                - productId: "64prd001abc111"
                  quantity: 3
                  sellingPrice: 1199
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "64ord001abc111 Order Updated."
                  data:
                    type: object
                    properties:
                      order:
                        $ref: "#/components/schemas/Order"
        "400":
          description: Order is not in Pending status or no items provided or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notPending:
                  summary: Order cannot be edited
                  value:
                    success: false
                    message: "Only Pending orders can be edited"
                noItems:
                  summary: No items in request
                  value:
                    success: false
                    message: "No items provided to place order."
                insufficientStock:
                  summary: Stock not available
                  value:
                    success: false
                    message: "Running Shoes's Stock is Insufficient."
        "404":
          description: Order or product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                orderNotFound:
                  summary: Order not found
                  value:
                    success: false
                    message: "64ord001abc111 Order not found"
                productNotFound:
                  summary: Product not found
                  value:
                    success: false
                    message: "Product 64prd001abc111 not found"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete a pending order
      description: >
        Permanently deletes an order placed by the authenticated customer.
        Only orders with status **"Pending"** can be deleted.
        Returns **204 No Content** on successful deletion.
      tags:
        - Orders - Customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the order to delete
          example: "64ord001abc111"
      responses:
        "204":
          description: Order deleted successfully. No content returned.
        "400":
          description: Order is not in Pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Only Pending orders can be deleted."
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "64ord001abc111 Order not found."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ─────────────────────────────────────────
  # VENDOR ROUTES
  # ─────────────────────────────────────────

  /orders/vendor:
    get:
      summary: List all orders across vendor's stores
      description: Returns all orders belonging to every store owned by the authenticated vendor. Populates product, store, and customer (user) details.
      tags:
        - Orders - Vendor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All vendor store orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "VendorJohn's all stores orders fetched."
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/VendorPopulatedOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/store/{storeId}:
    get:
      summary: List all orders for a specific store
      description: Returns all orders placed for a specific store. Only accessible by authenticated vendors. Populates product, store, and customer details.
      tags:
        - Orders - Vendor
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: storeId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the store
          example: "64str001abc111"
      responses:
        "200":
          description: Store orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SportZone Store orders fetched."
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/VendorPopulatedOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/vendor/{orderId}:
    put:
      summary: Update order status
      description: >
        Allows the authenticated vendor to update the status of an order.
        Valid status values are: **Pending**, **Accepted**, **Delivered**, **Canceled**.
      tags:
        - Orders - Vendor
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the order to update
          example: "64ord001abc111"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
            example:
              status: "Accepted"
      responses:
        "200":
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "64ord001abc111 Order status updated successfully"
                  data:
                    type: object
                    properties:
                      order:
                        $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "64ord001abc111 Order not found."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ─────────────────────────────────────────
  # SHARED ROUTES
  # ─────────────────────────────────────────

  /orders/{orderId}:
    get:
      summary: Get order by ID
      description: Fetches a single order by its ID. Accessible by both authenticated customers and vendors. Returns fully populated product, store, and store owner details.
      tags:
        - Orders - Shared
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the order to fetch
          example: "64ord001abc111"
      responses:
        "200":
          description: Order fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "64ord001abc111 Order fetched."
                  data:
                    type: object
                    properties:
                      order:
                        $ref: "#/components/schemas/PopulatedOrder"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "64ord001abc111 Order not found."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    CreateOrderRequest:
      type: array
      description: Array of cart items to order. Orders are split per store automatically.
      items:
        type: object
        required:
          - productId
          - quantity
          - sellingPrice
        properties:
          productId:
            type: string
            description: MongoDB ObjectId of the product
            example: "64prd001abc111"
          quantity:
            type: integer
            minimum: 1
            description: Number of units to order
            example: 2
          sellingPrice:
            type: number
            description: Selling price (after discounts) at the time of ordering
            example: 1199

    EditOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Updated list of items for the order
          items:
            type: object
            required:
              - productId
              - quantity
              - sellingPrice
            properties:
              productId:
                type: string
                description: MongoDB ObjectId of the product
                example: "64prd001abc111"
              quantity:
                type: integer
                minimum: 1
                description: Updated quantity
                example: 3
              sellingPrice:
                type: number
                description: Selling price at the time of edit
                example: 1199

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Pending
            - Accepted
            - Delivered
            - Canceled
          description: New status to set for the order
          example: Accepted

    OrderItem:
      type: object
      properties:
        product:
          type: string
          description: MongoDB ObjectId referencing the Product
          example: "64prd001abc111"
        quantity:
          type: integer
          minimum: 1
          description: Number of units ordered
          example: 2
        price:
          type: number
          description: Original price of the product at the time of order
          example: 1299
        sellingPrice:
          type: number
          description: Discounted selling price at the time of order
          example: 1199

    Order:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId of the order
          example: "64ord001abc111"
        user:
          type: string
          description: MongoDB ObjectId referencing the customer
          example: "64usr001abc111"
        store:
          type: string
          description: MongoDB ObjectId referencing the store
          example: "64str001abc111"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalAmount:
          type: number
          description: Total amount for the order (sellingPrice × quantity for all items)
          example: 2398
        status:
          type: string
          enum:
            - Pending
            - Accepted
            - Delivered
            - Canceled
          description: Current status of the order
          example: Pending
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000Z"

    PopulatedOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            store:
              type: object
              description: Populated store details
              properties:
                _id:
                  type: string
                  example: "64str001abc111"
                storeName:
                  type: string
                  example: "SportZone"
                owner:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: "64usr002abc222"
                    username:
                      type: string
                      example: "VendorJohn"
            items:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: object
                    description: Populated product details
                    properties:
                      _id:
                        type: string
                        example: "64prd001abc111"
                      productName:
                        type: string
                        example: "Running Shoes"
                      price:
                        type: number
                        example: 1299
                      sellingPrice:
                        type: number
                        description: Virtual field — price after product and store discounts
                        example: 1199
                      productImageUrl:
                        type: string
                        example: "https://example.com/shoe.jpg"
                  quantity:
                    type: integer
                    example: 2
                  price:
                    type: number
                    example: 1299
                  sellingPrice:
                    type: number
                    example: 1199

    VendorPopulatedOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            user:
              type: object
              description: Populated customer details
              properties:
                _id:
                  type: string
                  example: "64usr001abc111"
                username:
                  type: string
                  example: "CustomerJohn"
                email:
                  type: string
                  example: "john@example.com"
            store:
              type: object
              description: Populated store details
              properties:
                _id:
                  type: string
                  example: "64str001abc111"
                storeName:
                  type: string
                  example: "SportZone"
            items:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "64prd001abc111"
                      productName:
                        type: string
                        example: "Running Shoes"
                      price:
                        type: number
                        example: 1299
                  quantity:
                    type: integer
                    example: 2
                  price:
                    type: number
                    example: 1299
                  sellingPrice:
                    type: number
                    example: 1199

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Something went wrong."
        data:
          type: object
          description: Additional error context (optional)

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Unauthorized. Token missing or invalid."

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Internal Server Error."
