tags:
  - name: Cart
    description: Cart management endpoints. All routes are protected and require a valid JWT token. Only customers can access these endpoints.

paths:
  /cart:
    get:
      summary: Get user's cart
      description: Fetches the current authenticated customer's cart with fully populated product and store details. Returns empty items array if cart does not exist yet.
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart fetched successfully or cart is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
              examples:
                cartWithItems:
                  summary: Cart with items
                  value:
                    success: true
                    message: "John's Cart Fetched."
                    data:
                      cart:
                        _id: "64abc123def456"
                        user: "64abc111aaa111"
                        items:
                          - product:
                              _id: "64prd001abc111"
                              productName: "Running Shoes"
                              sellingPrice: 1299
                              store:
                                _id: "64str001abc111"
                                storeName: "SportZone"
                                owner:
                                  _id: "64usr001abc111"
                                  username: "VendorJohn"
                            quantity: 2
                        createdAt: "2024-01-01T10:00:00.000Z"
                        updatedAt: "2024-01-02T10:00:00.000Z"
                      totalAmount: 2598
                emptyCart:
                  summary: Cart is empty
                  value:
                    success: true
                    message: "John's Cart is empty"
                    data:
                      items: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cart/add:
    post:
      summary: Add a product to cart
      description: Adds a product to the authenticated customer's cart. If the product already exists in the cart, its quantity is incremented. Validates stock availability before adding.
      tags:
        - Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
            example:
              productId: "64prd001abc111"
              quantity: 2
              sellingPrice: 1299
      responses:
        "200":
          description: Product added to cart successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
              example:
                success: true
                message: "Running Shoes is added to Cart."
                data:
                  cart:
                    _id: "64abc123def456"
                    user: "64abc111aaa111"
                    items:
                      - product: "64prd001abc111"
                        quantity: 2
                        sellingPrice: 1299
                    createdAt: "2024-01-01T10:00:00.000Z"
                    updatedAt: "2024-01-02T10:00:00.000Z"
        "400":
          description: Insufficient stock for the requested quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Running Shoes's Stock is Insufficient."
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "64prd001abc111 Product not Found."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cart/remove/{productId}:
    delete:
      summary: Remove or decrement a product from cart
      description: >
        Removes or decrements a product from the cart based on the `removeAll` flag in the request body.
        - If `removeAll` is `true` — the product is completely removed from the cart regardless of quantity.
        - If `removeAll` is `false` or not provided — the quantity is decremented by 1. If quantity reaches 0, the item is removed.
      tags:
        - Cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the product to remove
          example: "64prd001abc111"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveFromCartRequest"
            examples:
              decrementOne:
                summary: Decrement quantity by 1
                value:
                  removeAll: false
              removeCompletely:
                summary: Remove product entirely
                value:
                  removeAll: true
      responses:
        "200":
          description: Cart updated successfully or cart was already empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
              examples:
                cartUpdated:
                  summary: Cart updated after removal
                  value:
                    success: true
                    message: "John's Cart updated."
                    data:
                      cart:
                        _id: "64abc123def456"
                        user: "64abc111aaa111"
                        items: []
                        createdAt: "2024-01-01T10:00:00.000Z"
                        updatedAt: "2024-01-02T10:00:00.000Z"
                cartEmpty:
                  summary: Cart was already empty
                  value:
                    success: true
                    message: "John's Cart is Empty."
                    data:
                      items: []
        "404":
          description: Product not found in cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "64prd001abc111 Product not found in Cart."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cart/clear:
    delete:
      summary: Clear entire cart
      description: Removes all items from the authenticated customer's cart. If the cart is already empty, returns a success message without error.
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart cleared successfully or was already empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
              examples:
                cartCleared:
                  summary: Cart cleared successfully
                  value:
                    success: true
                    message: "John's Cart Cleared."
                alreadyEmpty:
                  summary: Cart was already empty
                  value:
                    success: true
                    message: "John's Cart is already Empty."
                    data:
                      items: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    AddToCartRequest:
      type: object
      required:
        - productId
        - quantity
        - sellingPrice
      properties:
        productId:
          type: string
          description: MongoDB ObjectId of the product to add
          example: "64prd001abc111"
        quantity:
          type: integer
          minimum: 1
          description: Number of units to add to the cart
          example: 2
        sellingPrice:
          type: number
          description: Selling price of the product at the time of adding to cart
          example: 1299

    RemoveFromCartRequest:
      type: object
      properties:
        removeAll:
          type: boolean
          description: >
            If true, removes the product entirely from cart.
            If false or not provided, decrements quantity by 1.
          example: false

    CartItem:
      type: object
      properties:
        product:
          type: string
          description: MongoDB ObjectId referencing the Product
          example: "64prd001abc111"
        quantity:
          type: integer
          minimum: 1
          description: Number of units of this product in the cart
          example: 2
        sellingPrice:
          type: number
          description: Price at which product was added to cart
          example: 1299

    Cart:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId of the cart
          example: "64abc123def456"
        user:
          type: string
          description: MongoDB ObjectId referencing the User who owns this cart
          example: "64abc111aaa111"
        items:
          type: array
          description: List of products in the cart
          items:
            $ref: "#/components/schemas/CartItem"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-02T10:00:00.000Z"

    CartResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "John's Cart Fetched."
        data:
          type: object
          properties:
            cart:
              $ref: "#/components/schemas/Cart"
            totalAmount:
              type: number
              description: Total price of all items in the cart (sellingPrice × quantity)
              example: 2598

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Something went wrong."
        data:
          type: object
          description: Additional context about the error (optional)

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Unauthorized. Token missing or invalid."

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Internal Server Error."
